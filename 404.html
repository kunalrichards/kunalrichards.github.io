<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Kunal Richards</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#04080f">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<style>
:root{
  --bg:#04080f;--s1:#0a1020;--ac:#38bdf8;--ac2:#a78bfa;--gr:#34d399;
  --tx:#c8d5e8;--dim:#7a8a9e;--hd:#f0f5fc;--bd:#1a2d45;
  --grd:linear-gradient(135deg,#38bdf8,#a78bfa);
  --grd-btn:linear-gradient(135deg,#0c7fb8,#6d4bc9);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:2rem 1.25rem;overflow-x:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(56,189,248,.05) 1px,transparent 1px);
  background-size:32px 32px;
}
body::after{
  content:'';position:fixed;top:0;left:0;right:0;height:65vh;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 100% at 50% -5%,rgba(56,189,248,.07) 0%,transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:560px;}
.logo{
  font-size:1.5rem;font-weight:900;letter-spacing:-1px;text-decoration:none;
  background:var(--grd);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;display:inline-block;
  padding:.5rem .75rem;margin:-.5rem -.75rem 1.5rem;
}
.code{
  font-size:clamp(5rem,22vw,9rem);font-weight:900;line-height:1;letter-spacing:-4px;
  background:var(--grd);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
h1{font-size:clamp(1.3rem,5vw,1.7rem);color:var(--hd);font-weight:800;margin:.5rem 0 .6rem;letter-spacing:-.5px;}
p{color:var(--dim);font-size:.9rem;max-width:420px;margin:0 auto 2rem;}
.btns{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:.72rem 1.5rem;border-radius:10px;font-weight:700;font-size:.85rem;
  text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;
  transition:transform .18s ease,box-shadow .2s ease,border-color .2s ease,color .2s ease;
  border:1.5px solid transparent;
}
.btn-fill{background:var(--grd-btn);color:#fff;box-shadow:0 4px 20px rgba(56,189,248,.28);}
.btn-fill:hover{transform:translateY(-3px);box-shadow:0 8px 36px rgba(56,189,248,.45);}
.btn-outline{border-color:var(--bd);color:var(--hd);}
.btn-outline:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-2px);}
.redirect{margin-top:1.6rem;font-size:.75rem;color:var(--dim);}
.redirect b{color:var(--ac);}
*:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo" aria-label="KR. — Kunal Richards, home">KR.</a>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page took a wrong turn</h1>
    <p>The link is broken or the page has moved. Let's get you back to something that works — like the rest of the portfolio.</p>
    <div class="btns">
      <a href="/" class="btn btn-fill">← Back to Portfolio</a>
      <a href="/cv.html" class="btn btn-outline">View CV</a>
      <a href="/Kunal_WellnessApp/" class="btn btn-outline">Wellness App</a>
    </div>
    <div class="redirect" id="rd">Redirecting to the homepage in <b id="ct">10</b>s…</div>
  </div>
  <script>
    (function(){
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        document.getElementById('rd').style.display='none'; return;
      }
      var n=10, el=document.getElementById('ct');
      var t=setInterval(function(){
        n--; if(el) el.textContent=n;
        if(n<=0){ clearInterval(t); location.replace('/'); }
      },1000);
    })();
  </script>
</body>
</html>
